<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img">
  <title>Vipala Gavas</title>
  <desc>DevOps and full-stack engineer. Twelve years shipping production web apps, Ruby on Rails at the core and AWS underneath.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0C10"/>
      <stop offset="1" stop-color="#2A141B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.42" r="0.45" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#E8B4C4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8B4C4" stop-opacity="0"/>
      <animate attributeName="cx" values="0.76;0.88;0.72;0.76" dur="18s" repeatCount="indefinite"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="900" height="300" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="300" fill="url(#card)"/>
    <rect width="900" height="300" fill="url(#glow)"/>
    <ellipse cx="30" cy="290" rx="190" ry="120" fill="#E8B4C4" opacity="0.06">
      <animate attributeName="cx" values="10;80;10" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <text x="56" y="74" fill="#D7B4BF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.6">PUNE  &#183;  REMOTE</text>

    <text x="56" y="132" fill="#F8F1F4" font-family="Georgia, Iowan Old Style, Palatino, Palatino Linotype, serif" font-size="52" font-weight="700">Vipala Gavas</text>

    <line x1="56" y1="158" x2="402" y2="158" stroke="#E8B4C4" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="56" cy="158" r="4" fill="#F3C6D4">
      <animate attributeName="cx" values="56;402;56" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#F0E0E6">
      <text x="56" y="198" opacity="1">
        DevOps and full-stack specialist
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.34;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="198" opacity="0">
        Twelve years shipping production web apps
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="198" opacity="0">
        Rails at the core. AWS underneath.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.66;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#D7B4BF">
      <text x="56" y="246">Rails</text>
      <text x="124" y="246">AWS</text>
      <text x="184" y="246">DevOps</text>
    </g>
    <g fill="#E8B4C4">
      <rect x="56" y="256" width="32" height="3" rx="1.5" opacity="1">
        <animate attributeName="opacity" values="1;1;0.22;0.22;1" keyTimes="0;0.28;0.34;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="124" y="256" width="32" height="3" rx="1.5" opacity="0.22">
        <animate attributeName="opacity" values="0.22;0.22;1;1;0.22;0.22" keyTimes="0;0.28;0.34;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="184" y="256" width="52" height="3" rx="1.5" opacity="0.22">
        <animate attributeName="opacity" values="0.22;0.22;1;1;0.22" keyTimes="0;0.60;0.66;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(748 142)">
      <circle r="108" fill="#E8B4C4" opacity="0.07">
        <animate attributeName="r" values="102;112;102" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="none" stroke="#E8B4C4" stroke-opacity="0.28" stroke-width="1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        <circle cx="88" cy="0" r="4" fill="#F3C6D4"/>
        <circle cx="-44" cy="76.2" r="3.5" fill="#E8B4C4" opacity="0.7"/>
        <circle cx="-44" cy="-76.2" r="3.5" fill="#E8B4C4" opacity="0.7"/>
      </g>
      <g transform="translate(-40 -54)">
        <path d="M0 0 L40 108 L80 0" fill="none" stroke="#F3C6D4" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="4.5" cx="0" cy="0" fill="#F3C6D4">
          <animateMotion dur="7s" repeatCount="indefinite" path="M0 0 L40 108 L80 0"/>
        </circle>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="20" fill="none" stroke="#5A3040" stroke-width="1"/>
</svg>
