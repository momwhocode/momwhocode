<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img">
  <title>Vipala Gavas</title>
  <desc>Twelve years shipping production web apps. Rails at the core, cloud underneath, AI-first by default.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCFD"/>
      <stop offset="1" stop-color="#F6ECEF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.42" r="0.45" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#631240" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#631240" stop-opacity="0"/>
      <animate attributeName="cx" values="0.76;0.88;0.72;0.76" dur="18s" repeatCount="indefinite"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="900" height="300" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="300" fill="url(#card)"/>
    <rect width="900" height="300" fill="url(#glow)"/>
    <ellipse cx="30" cy="290" rx="190" ry="120" fill="#631240" opacity="0.045">
      <animate attributeName="cx" values="10;80;10" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <text x="56" y="74" fill="#7A5360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.6">ELESCRIPT TECHNOLOGIES  &#183;  PUNE</text>

    <text x="56" y="132" fill="#631240" font-family="Georgia, Iowan Old Style, Palatino, Palatino Linotype, serif" font-size="52" font-weight="700">Vipala Gavas</text>

    <line x1="56" y1="158" x2="402" y2="158" stroke="#631240" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="56" cy="158" r="4" fill="#631240">
      <animate attributeName="cx" values="56;402;56" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3A242C">
      <text x="56" y="198" opacity="1">
        Twelve years shipping production web apps
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.34;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="198" opacity="0">
        Rails at the core. AWS and GCP underneath.
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="198" opacity="0">
        AI-first by default.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.66;0.92;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7A5360">
      <text x="56" y="246">Rails</text>
      <text x="120" y="246">Cloud</text>
      <text x="196" y="246">AI-first</text>
    </g>
    <g fill="#631240">
      <rect x="56" y="256" width="32" height="3" rx="1.5" opacity="1">
        <animate attributeName="opacity" values="1;1;0.2;0.2;1" keyTimes="0;0.28;0.34;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="120" y="256" width="40" height="3" rx="1.5" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.2;1;1;0.2;0.2" keyTimes="0;0.28;0.34;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="196" y="256" width="48" height="3" rx="1.5" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.2;1;1;0.2" keyTimes="0;0.60;0.66;0.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(748 142)">
      <circle r="108" fill="#631240" opacity="0.05">
        <animate attributeName="r" values="102;112;102" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="none" stroke="#631240" stroke-opacity="0.18" stroke-width="1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        <circle cx="88" cy="0" r="4" fill="#631240"/>
        <circle cx="-44" cy="76.2" r="3.5" fill="#631240" opacity="0.55"/>
        <circle cx="-44" cy="-76.2" r="3.5" fill="#631240" opacity="0.55"/>
      </g>
      <g transform="translate(-40 -54)">
        <path d="M0 0 L40 108 L80 0" fill="none" stroke="#631240" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="4.5" cx="0" cy="0" fill="#631240">
          <animateMotion dur="7s" repeatCount="indefinite" path="M0 0 L40 108 L80 0"/>
        </circle>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="20" fill="none" stroke="#E4D0D7" stroke-width="1"/>
</svg>
